[project]
name = "autoresearch-crypto"
version = "0.1.0"
description = "Autonomous cryptocurrency quantitative trading strategy research framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0.0",
    "matplotlib>=3.10.8",
    "nado-protocol>=0.3.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "python-okx>=0.4.1",
    "requests>=2.32.0",
    "tiktoken>=0.11.0",
    "torch>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/autoresearch-crypto"
Repository = "https://github.com/yourusername/autoresearch-crypto"

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
